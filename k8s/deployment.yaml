apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp308-api
  labels:
    app: mp308-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp308-api
  template:
    metadata:
      labels:
        app: mp308-api
    spec:
      containers:
        - name: mp308-api
          image: mp308-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODEL_PATH
              value: /app/models/model.joblib
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
