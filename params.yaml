# Configuration parameters for SCSE3040 MLOps Mini Project — Group G050 (MP308)

data:
  raw_dir: "data/raw"
  train_file: "train.csv"
  later_file: "later.csv"
  holdout_file: "holdout_features.csv"
  cleaned_dir: "data/cleaned"

cleaning:
  leaking_columns:
    - "pick_time_from_scanner"
  drop_columns:
    - "record_id"
    - "date"
  drop_duplicates: true
  sentinel_values:
    shift_hour: -1
  stuck_sensor:
    column: "shelf_height_m"
    start_date: "2026-05-09"
    end_date: "2026-05-24"
  zone_type_aliases:
    "amb.": "ambient"
    "bul.": "bulky"
    "chi.": "chilled"

features:
  numeric:
    - "items_in_order"
    - "aisle_distance_m"
    - "picker_exp_months"
    - "shelf_height_m"
    - "shift_hour"
    - "order_weight_kg"
  categorical:
    - "zone_type"
    - "shift"
  target: "pick_seconds"

training:
  cv_folds: 5
  random_state: 42
  candidates:
    - name: "Ridge"
      params:
        alpha: 1.0
    - name: "RandomForestRegressor"
      params:
        n_estimators: 200
        max_depth: 12
        min_samples_leaf: 2
        random_state: 42
        n_jobs: -1
    - name: "GradientBoostingRegressor"
      params:
        n_estimators: 200
        max_depth: 4
        learning_rate: 0.08
        random_state: 42
    - name: "HistGradientBoostingRegressor"
      params:
        max_iter: 200
        max_depth: 6
        learning_rate: 0.08
        min_samples_leaf: 20
        random_state: 42

  retrain:
    name: "GradientBoostingRegressor"
    params:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.08
      random_state: 42

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "warehouse_picking_g050_mp308"
  registered_model_name: "warehouse_picking_model"
  champion_alias: "champion"

monitoring:
  psi_bins: 10
  later_split_ratio: 0.7
  promotion_max_ratio: 0.90

output:
  model_path: "models/model.joblib"
  predictions_path: "predictions/holdout_predictions.csv"
  findings_path: "reports/findings.yaml"
